# Labels to apply to all resources created by this Helm chart
argocd:
  namespace: argocd

  # kubechecks generates the manifests it diffs by calling Argo CD's own
  # repo-server over gRPC (KUBECHECKS_ARGOCD_REPOSITORY_ENDPOINT). The argo-cd
  # chart puts a NetworkPolicy over that port admitting only four in-namespace
  # Argo CD components, so on a cluster that enforces NetworkPolicy the call
  # from this chart's namespace is dropped and every check times out with a
  # context deadline that names no policy. This adds the missing source.
  #
  # NetworkPolicies union, so this neither edits nor conflicts with the policy
  # the argo-cd release owns. It is created in `namespace` above, because a
  # NetworkPolicy is evaluated in the namespace of the pods it selects.
  networkPolicy:
    # DISABLE THIS if the repo-server is not already selected by some other
    # NetworkPolicy. A pod with no policy accepts all ingress; the FIRST policy
    # to select it switches it to default-deny. So on such a cluster this does
    # not add kubechecks to an existing allowlist -- it creates the allowlist,
    # and everything not on it, argocd-server and the application controller
    # included, loses the repo-server. Argo CD then renders nothing. On an
    # upgrade that happens the moment this chart is applied.
    #
    # To know which cluster you have: `kubectl get networkpolicy -n argocd`.
    # The argo-cd chart creates one (global.networkPolicy.create defaults true),
    # so a Helm-installed Argo CD is normally safe; an Argo CD installed from
    # plain manifests has none, and neither does a release that turned them off.
    #
    # That hazard is what took the chart to 4.0.0: defaulting this on can change
    # how an existing cluster behaves, so the version says so rather than
    # arriving as a minor nobody reads the notes for.
    create: true

    # Selects the repo-server pods within `namespace` above. The argo-cd chart
    # also labels them app.kubernetes.io/instance: <its release name>; this
    # deliberately does not, so the selector holds whatever that release is
    # called. Add the instance label here if more than one Argo CD shares the
    # namespace.
    repoServerSelector:
      app.kubernetes.io/name: argocd-repo-server

    # The repo-server's gRPC port. Named rather than numbered, as the argo-cd
    # chart's own policy names it, so a repo-server moved off 8081 carries
    # this with it. A number works too.
    port: repo-server

commonLabels: {}

configMap:
  create: false
  env: {}
  # KUBECHECKS_ADDITIONAL_APPS_NAMESPACES: "*"
  # KUBECHECKS_ARGOCD_API_INSECURE: "false"
  # KUBECHECKS_ARGOCD_API_PATH_PREFIX: /
  # KUBECHECKS_ARGOCD_API_NAMESPACE: argocd
  # KUBECHECKS_ARGOCD_WEBHOOK_URL: https://argocd.<domain.com>/api/webhook
  # KUBECHECKS_FALLBACK_K8S_VERSION: "1.22.0"
  # KUBECHECKS_LOG_LEVEL: debug
  # KUBECHECKS_NAMESPACE: kubechecks
  # KUBECHECKS_WEBHOOK_URL_BASE: https://kubechecks.<domain.com>.
  # KUBECHECKS_WEBHOOK_URL_PREFIX: kubechecks
  # KUBECHECKS_ARGOCD_API_SERVER_ADDR: argocd.<domain.com>
  # ARGOCD_EXEC_TIMEOUT: 600s
  # KUBECHECKS_OTEL_COLLECTOR_PORT: "4317"
  # KUBECHECKS_OTEL_ENABLED: "true"
  # KUBECHECKS_VCS_TYPE: "github"
  # KUBECHECKS_TIDY_OUTDATED_COMMENTS_MODE: "hide" # other options delete
  # KUBECHECKS_ARCHIVE_CACHE_DIR: "/tmp/kubechecks/archives"
  # KUBECHECKS_ARCHIVE_CACHE_TTL: "24h"
  # KUBECHECKS_REPO_CACHE_DIR: "/tmp/kubechecks/repos"
  # KUBECHECKS_REPO_CACHE_ENABLED "true"
  # KUBECHECKS_REPO_CACHE_TTL: "24h"

deployment:
  annotations: {}
    # reloader.stakater.com/auto: "true"

  podAnnotations: {}

  args: ["controller"]

  # Default values for kubechecks.
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 256Mi
      cpu: 200m

  revisionHistoryLimit: 10
  replicaCount: 1

  image:
    pullPolicy: Always
    name: "ghcr.io/zapier/kubechecks"
    tag: "latest"

  imagePullSecrets: []

  nodeSelector: {}

  tolerations: []

  affinity: {}

  podSecurityContext: {}
    # runAsNonRoot: true
    # runAsUser: 32123
    # fsGroup: 32123

  securityContext: {}
    # allowPrivilegeEscalation: false
    # privileged: false
    # capabilities:
    #   drop:
    #     - ALL
    # readOnlyRootFilesystem: false

  env: []

  envFrom: []

  startupProbe:
    failureThreshold: 30
    periodSeconds: 10

  livenessProbe:
    failureThreshold: 30
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  readinessProbe:
    failureThreshold: 30
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  volumes: []
  volumeMounts: []

secrets:
  create: false
  name: '{{ include "kubechecks.fullname" . }}'
  # envs can be used for writing sensitive environment variables
  # to the secret resource. These should be passed into the
  # deployment as arguments.
  env: {}
  # KUBECHECKS_VCS_TOKEN: <token>

serviceAccount:
  # Specifies whether a service account should be created or used
  create: true
  enabled: true
  name: '{{ include "kubechecks.fullname" . }}'
  annotations: {}

service:
  create: true
  type: ClusterIP
  port: 8080
  name: http

ingress:
  create: false
  className: ""
  # annotations:
  #   kubernetes.io/ingress.class: nginx
  #   # See https://cert-manager.readthedocs.io/en/latest/reference/ingress-shim.html#supported-annotations
  #   kubernetes.io/tls-acme: "true"
  hosts:
    kubechecks.local:
      paths:
        - path: "/hooks"
          pathType: Prefix

  # Secrets must be manually created in the namespace
  # tls:
  #  - secretName: kubechecks-ingress-tls
  #    hosts:
  #    - kubechecks.example.com

autoscaling:
  create: false
  # minReplicas: 1
  # maxReplicas: 100
  # targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
